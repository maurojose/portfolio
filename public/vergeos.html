<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Oráculo — Protótipo</title>

  <!-- Single-file JSX prototype. Requires internet to load React/Babel from CDN. -->
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    :root {
      --bg: #f3f3ef;
      --panel: #ffffff;
      --panel-2: #f8f8f5;
      --ink: #171816;
      --muted: #74766f;
      --line: #e5e5df;
      --line-strong: #d4d4cc;
      --black: #171816;
      --lime: #c9ff4a;
      --lime-2: #e8ffae;
      --orange: #ff805f;
      --yellow: #ffd66b;
      --blue: #7ea8ff;
      --purple: #9b87f5;
      --green: #78d79b;
      --red: #f16d6d;
      --shadow: 0 10px 30px rgba(18, 19, 17, .06);
      --radius: 18px;
      --radius-sm: 12px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body,
    #root {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--ink);
      overflow-x: hidden;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    ::selection {
      background: var(--lime);
      color: var(--ink);
    }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 220px minmax(0, 1fr);
      background: var(--bg);
    }

    .sidebar {
      position: fixed;
      inset: 0 auto 0 0;
      width: 220px;
      padding: 18px 14px;
      background: #161714;
      color: #f7f7f2;
      display: flex;
      flex-direction: column;
      z-index: 20;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px 20px;
      border-bottom: 1px solid rgba(255, 255, 255, .09);
    }

    .brand-mark {
      width: 34px;
      height: 34px;
      background: var(--lime);
      color: #111;
      border-radius: 10px;
      display: grid;
      place-items: center;
      font-weight: 900;
      letter-spacing: -1px;
      transform: rotate(-3deg);
    }

    .brand-copy strong {
      display: block;
      font-size: 14px;
    }

    .brand-copy span {
      color: rgba(255, 255, 255, .48);
      font-size: 11px;
    }

    .nav {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-top: 20px;
    }

    .nav-button {
      border: 0;
      background: transparent;
      color: rgba(255, 255, 255, .66);
      padding: 11px 12px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      gap: 11px;
      text-align: left;
      transition: .18s ease;
      font-size: 13px;
    }

    .nav-button:hover {
      color: #fff;
      background: rgba(255, 255, 255, .055);
    }

    .nav-button.active {
      color: #111;
      background: var(--lime);
      font-weight: 700;
    }

    .nav-icon {
      width: 18px;
      text-align: center;
      font-size: 15px;
      opacity: .9;
    }

    .sidebar-bottom {
      margin-top: auto;
      padding: 14px 10px 4px;
      border-top: 1px solid rgba(255, 255, 255, .08);
    }

    .mini-profile {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 11px;
      font-weight: 800;
      background: #ecece5;
      color: #121212;
      flex: 0 0 auto;
    }

    .avatar.dark {
      background: #292a26;
      color: #fff;
    }

    .avatar.lime {
      background: var(--lime);
      color: #151515;
    }

    .mini-profile strong {
      font-size: 12px;
      display: block;
    }

    .mini-profile span {
      color: rgba(255, 255, 255, .46);
      font-size: 11px;
    }

    .main {
      grid-column: 2;
      min-width: 0;
      min-height: 100vh;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 15;
      height: 70px;
      padding: 0 24px;
      background: rgba(243, 243, 239, .88);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(212, 212, 204, .75);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .page-label {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .page-label small {
      color: var(--muted);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .08em;
    }

    .page-label strong {
      font-size: 15px;
    }

    .top-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .search {
      width: 260px;
      height: 38px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 12px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      color: var(--muted);
      box-shadow: 0 3px 12px rgba(0, 0, 0, .025);
    }

    .search input {
      border: 0;
      outline: 0;
      width: 100%;
      background: transparent;
      color: var(--ink);
      font-size: 12px;
    }

    .icon-btn,
    .primary-btn,
    .ghost-btn,
    .seg-btn {
      border-radius: 11px;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--ink);
      height: 38px;
      padding: 0 12px;
    }

    .icon-btn {
      width: 38px;
      padding: 0;
    }

    .primary-btn {
      background: var(--black);
      color: #fff;
      border-color: var(--black);
      font-weight: 700;
    }

    .ghost-btn:hover,
    .icon-btn:hover {
      border-color: var(--line-strong);
      background: #fafaf7;
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .hamburger-btn {
      display: none;
      width: 38px;
      height: 38px;
      align-items: center;
      justify-content: center;
      border-radius: 11px;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--ink);
      font-size: 16px;
      flex: 0 0 auto;
    }

    .sidebar-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(10, 10, 8, .45);
      z-index: 19;
    }

    .content {
      padding: 26px;
      max-width: 1600px;
      margin: 0 auto;
      transition: padding-right .2s ease;
    }

    .content.with-chat {
      padding-right: 388px;
    }

    .hero-row {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 22px;
    }

    .eyebrow {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .13em;
      color: var(--muted);
      margin-bottom: 7px;
      font-weight: 700;
    }

    .date-picker {
      position: relative;
      display: inline-block;
      margin-bottom: 7px;
    }

    .date-picker-trigger {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid var(--line);
      background: var(--panel);
      padding: 8px 11px;
      border-radius: 11px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .1em;
      color: var(--muted);
      font-weight: 700;
      box-shadow: 0 3px 12px rgba(0, 0, 0, .025);
    }

    .date-picker-trigger:hover {
      color: var(--ink);
      border-color: var(--line-strong);
      background: #fafaf7;
    }

    .date-picker-trigger .chev {
      font-size: 8px;
      opacity: .7;
    }

    .date-picker-pop {
      position: absolute;
      top: calc(100% + 10px);
      left: 0;
      z-index: 25;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      box-shadow: var(--shadow);
      padding: 14px;
      width: 272px;
      text-transform: none;
    }

    .cal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .cal-head strong {
      font-size: 11px;
      text-transform: capitalize;
      letter-spacing: -.01em;
    }

    .cal-nav {
      border: 0;
      background: transparent;
      width: 24px;
      height: 24px;
      border-radius: 7px;
      color: var(--muted);
      font-size: 12px;
    }

    .cal-nav:hover {
      background: var(--panel-2);
      color: var(--ink);
    }

    .cal-weekdays,
    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
    }

    .cal-weekdays span {
      font-size: 9px;
      color: var(--muted);
      text-align: center;
      display: block;
      padding-bottom: 6px;
    }

    .cal-day {
      border: 0;
      background: transparent;
      height: 28px;
      font-size: 10px;
      color: var(--ink);
      border-radius: 8px;
    }

    .cal-day:hover {
      background: var(--panel-2);
    }

    .cal-day.muted {
      color: var(--line-strong);
    }

    .cal-day.in-range {
      background: var(--lime-2);
      border-radius: 0;
    }

    .cal-day.range-start,
    .cal-day.range-end {
      background: var(--black);
      color: #fff;
      font-weight: 700;
    }

    .cal-day.today:not(.range-start):not(.range-end) {
      box-shadow: inset 0 0 0 1px var(--line-strong);
    }

    .cal-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--line);
    }

    .cal-presets {
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
    }

    .cal-presets .filter-chip {
      padding: 6px 8px;
    }

    h1 {
      font-size: clamp(28px, 3vw, 32px);
      margin: 0;
      letter-spacing: -.045em;
      line-height: .98;
      font-weight: 760;
    }

    .sub {
      color: var(--muted);
      margin-top: 9px;
      font-size: 13px;
      max-width: 720px;
      line-height: 1.5;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 8px 10px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 999px;
      font-size: 11px;
      color: var(--muted);
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--green);
    }

    .metric-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 12px;
    }

    .metric-card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 18px;
      min-height: 128px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, .022);
      position: relative;
      overflow: hidden;
    }

    .metric-card.featured {
      background: var(--lime);
      border-color: #b9ea45;
    }

    .metric-label {
      font-size: 11px;
      color: var(--muted);
    }

    .metric-card.featured .metric-label {
      color: rgba(18, 18, 18, .55);
    }

    .metric-value {
      font-size: 34px;
      letter-spacing: -.045em;
      font-weight: 780;
      margin-top: 8px;
    }

    .metric-foot {
      position: absolute;
      left: 18px;
      right: 18px;
      bottom: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 10px;
      color: var(--muted);
    }

    .delta {
      color: #2d7b47;
      font-weight: 700;
    }

    .danger {
      color: #b84242 !important;
    }

    .dashboard-grid {
      display: grid;
      grid-template-columns: 1.25fr .75fr;
      gap: 12px;
      margin-bottom: 12px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: 0 4px 18px rgba(0, 0, 0, .022);
      overflow: hidden;
    }

    .panel-pad {
      padding: 18px;
    }

    .panel-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }

    .panel-title {
      font-size: 14px;
      font-weight: 760;
      letter-spacing: -.015em;
    }

    .panel-sub {
      font-size: 11px;
      color: var(--muted);
      margin-top: 4px;
    }

    .chart-wrap {
      height: 230px;
      width: 100%;
    }

    .chart-label-row {
      display: flex;
      justify-content: space-between;
      color: var(--muted);
      font-size: 10px;
      margin-top: -4px;
    }

    .attention-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .attention-item {
      padding: 11px 12px;
      border: 1px solid var(--line);
      background: var(--panel-2);
      border-radius: 13px;
      display: grid;
      grid-template-columns: 30px minmax(0, 1fr) auto;
      gap: 9px;
      align-items: start;
    }

    .attention-symbol {
      width: 30px;
      height: 30px;
      border-radius: 9px;
      display: grid;
      place-items: center;
      background: #fff;
      border: 1px solid var(--line);
      font-size: 12px;
    }

    .attention-copy strong {
      display: block;
      font-size: 11px;
      margin-top: 1px;
    }

    .attention-copy span {
      display: block;
      font-size: 10px;
      color: var(--muted);
      margin-top: 3px;
      line-height: 1.35;
    }

    .tiny-link {
      font-size: 10px;
      color: var(--ink);
      border: 0;
      background: transparent;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .flow-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
    }

    .flow-item {
      padding: 13px;
      background: var(--panel-2);
      border: 1px solid var(--line);
      border-radius: 13px;
    }

    .flow-item .big {
      font-size: 22px;
      font-weight: 760;
      margin-top: 7px;
    }

    .flow-item span {
      font-size: 10px;
      color: var(--muted);
    }

    .capacity-strip {
      display: grid;
      grid-template-columns: 190px 1fr 60px;
      gap: 12px;
      align-items: center;
      padding: 9px 0;
      border-bottom: 1px solid var(--line);
    }

    .capacity-strip:last-child {
      border-bottom: 0;
    }

    .cap-name {
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 0;
    }

    .cap-name strong {
      font-size: 11px;
    }

    .cap-name span {
      font-size: 9px;
      color: var(--muted);
      display: block;
      margin-top: 2px;
    }

    .bar {
      height: 7px;
      background: #ecece7;
      border-radius: 999px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      border-radius: 999px;
      background: var(--ink);
      transition: .25s;
    }

    .bar-fill.warn {
      background: var(--orange);
    }

    .bar-fill.free {
      background: var(--green);
    }

    .cap-num {
      font-size: 11px;
      font-weight: 700;
      text-align: right;
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 18px 0;
    }

    .segmented {
      display: flex;
      align-items: center;
      padding: 3px;
      gap: 3px;
      background: #e9e9e3;
      border-radius: 12px;
    }

    .seg-btn {
      height: 31px;
      border: 0;
      background: transparent;
      font-size: 11px;
      color: var(--muted);
      padding: 0 12px;
    }

    .seg-btn.active {
      background: var(--panel);
      color: var(--ink);
      font-weight: 700;
      box-shadow: 0 2px 8px rgba(0, 0, 0, .05);
    }

    .filter-row {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
    }

    .filter-chip {
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--muted);
      border-radius: 999px;
      padding: 7px 10px;
      font-size: 10px;
    }

    .filter-chip.active {
      background: var(--black);
      border-color: var(--black);
      color: #fff;
    }

    .filter-chip .chip-x {
      margin-left: 6px;
      opacity: .6;
      font-weight: 700;
    }

    .filter-chip.active:hover .chip-x {
      opacity: 1;
    }

    .week-grid {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 12px;
    }

    .work-card {
      min-height: 280px;
      border-radius: 20px;
      overflow: hidden;
      border: 1px solid var(--line);
      background: var(--panel);
      position: relative;
      box-shadow: 0 5px 16px rgba(0, 0, 0, .03);
      transition: transform .18s ease, box-shadow .18s ease;
    }

    .work-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow);
    }

    .work-card.span-7 {
      grid-column: span 7;
    }

    .work-card.span-5 {
      grid-column: span 5;
    }

    .work-card.span-4 {
      grid-column: span 4;
    }

    .work-card.span-8 {
      grid-column: span 8;
    }

    .work-art {
      height: 185px;
      position: relative;
      overflow: hidden;
    }

    /* fake campaign arts */
    .art-a {
      background:
        radial-gradient(circle at 78% 22%, rgba(255, 255, 255, .8) 0 2%, transparent 2.3%),
        linear-gradient(125deg, #151613 0 44%, #d9ff72 44% 73%, #f2eee4 73% 100%);
    }

    .art-a:before {
      content: "NSG / FUTURE";
      position: absolute;
      left: 24px;
      top: 24px;
      color: white;
      font-size: 27px;
      font-weight: 800;
      letter-spacing: -1.4px;
      width: 120px;
      line-height: .9;
    }

    .art-a:after {
      content: "";
      width: 120px;
      height: 120px;
      border: 1px solid rgba(255, 255, 255, .65);
      border-radius: 50%;
      position: absolute;
      right: 45px;
      bottom: -28px;
      box-shadow: 0 0 0 28px rgba(255, 255, 255, .08), 0 0 0 56px rgba(255, 255, 255, .04);
    }

    .art-b {
      background: linear-gradient(140deg, #f16f4e, #ffce6b 60%, #f8f3e8);
    }

    .art-b:before {
      content: "Café & Conversa";
      position: absolute;
      left: 25px;
      bottom: 28px;
      font-family: Georgia, serif;
      font-style: italic;
      font-size: 30px;
      letter-spacing: -1px;
    }

    .art-b:after {
      content: "";
      width: 130px;
      height: 180px;
      border-radius: 80px 80px 14px 14px;
      background: rgba(255, 255, 255, .22);
      position: absolute;
      right: 45px;
      top: 17px;
      transform: rotate(8deg);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, .35);
    }

    .art-c {
      background: linear-gradient(115deg, #7959e7, #b7a7ff 55%, #e8e2ff);
    }

    .art-c:before {
      content: "UNIMED";
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      font-size: 60px;
      font-weight: 900;
      color: white;
      letter-spacing: -5px;
    }

    .art-c:after {
      content: "";
      position: absolute;
      width: 130px;
      height: 130px;
      border-radius: 50%;
      background: #c9ff4a;
      right: -20px;
      top: -25px;
      mix-blend-mode: screen;
    }

    .art-d {
      background: #111;
    }

    .art-d:before {
      content: "SCIENCE / CARE / FUTURE";
      color: #f8f8f2;
      position: absolute;
      left: 25px;
      top: 27px;
      width: 220px;
      font-size: 34px;
      font-weight: 900;
      line-height: .9;
      letter-spacing: -2px;
    }

    .art-d:after {
      content: "↗";
      position: absolute;
      right: 25px;
      bottom: 18px;
      font-size: 72px;
      color: var(--lime);
    }

    .art-e {
      background:
        linear-gradient(rgba(255, 255, 255, .23) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, .23) 1px, transparent 1px),
        linear-gradient(135deg, #1e62ff, #00b5cc);
      background-size: 28px 28px, 28px 28px, auto;
    }

    .art-e:before {
      content: "GOLDFINGER";
      position: absolute;
      left: 28px;
      bottom: 24px;
      font-size: 48px;
      font-weight: 800;
      color: white;
      letter-spacing: -3px;
    }

    .art-f {
      background: linear-gradient(135deg, #eaefe9, #cfe7d0);
    }

    .art-f:before {
      content: "TREMEMBÉ";
      position: absolute;
      left: 25px;
      top: 25px;
      color: #1e4f34;
      font-size: 46px;
      font-weight: 800;
      letter-spacing: -3px;
    }

    const MONTHS = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
    const MONTHS_ABBR = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
    const WEEKDAYS = ['S', 'T', 'Q', 'Q', 'S', 'S', 'D'];
    const TODAY = new Date(2026, 7, 24);

    function addDays(date, n) {
      const d = new Date(date);
      d.setDate(d.getDate() + n);
      return d;
    }

    function startOfWeekMonday(date) {
      const d = new Date(date);
      const day = (d.getDay() + 6) % 7;
      d.setDate(d.getDate() - day);
      d.setHours(0, 0, 0, 0);
      return d;
    }

    function sameDay(a, b) {
      return a && b && a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
    }

    function formatRange(range) {
      const { start, end } = range;
      if (start.getFullYear() === end.getFullYear() && start.getMonth() === end.getMonth()) {
        return `${start.getDate()}–${end.getDate()} ${MONTHS_ABBR[end.getMonth()]}`;
      }
      return `${start.getDate()} ${MONTHS_ABBR[start.getMonth()]} – ${end.getDate()} ${MONTHS_ABBR[end.getMonth()]}`;
    }

    function DateRangePicker({ range, setRange }) {
      const [open, setOpen] = useState(false);
      const [viewDate, setViewDate] = useState(new Date(range.end));
      const [pending, setPending] = useState(null);
      const ref = useRef();

      useEffect(() => {
        function onDocClick(e) { if (ref.current && !ref.current.contains(e.target)) setOpen(false); }
        document.addEventListener('mousedown', onDocClick);
        return () => document.removeEventListener('mousedown', onDocClick);
      }, []);

      function pickDay(day) {
        if (!pending) {
          setPending(day);
        } else {
          const start = day < pending ? day : pending;
          const end = day < pending ? pending : day;
          setRange({ start, end });
          setPending(null);
          setOpen(false);
        }
      }

      function preset(days) {
        const end = TODAY;
        const start = addDays(end, -(days - 1));
        setRange({ start, end });
        setViewDate(end);
        setPending(null);
        setOpen(false);
      }

      const firstOfMonth = new Date(viewDate.getFullYear(), viewDate.getMonth(), 1);
      const gridStart = startOfWeekMonday(firstOfMonth);
      const days = Array.from({ length: 42 }, (_, i) => addDays(gridStart, i));
      const activeStart = pending || range.start;
      const activeEnd = pending ? null : range.end;

      return <div className="date-picker" ref={ref}>
        <button type="button" className="date-picker-trigger" onClick={() => setOpen(o => !o)}>
          ◷ {formatRange(range)}<span className="chev">⌄</span>
        </button>
        {open && <div className="date-picker-pop">
          <div className="cal-head">
            <button type="button" className="cal-nav" onClick={() => setViewDate(d => new Date(d.getFullYear(), d.getMonth() - 1, 1))}>‹</button>
            <strong>{MONTHS[viewDate.getMonth()]} {viewDate.getFullYear()}</strong>
            <button type="button" className="cal-nav" onClick={() => setViewDate(d => new Date(d.getFullYear(), d.getMonth() + 1, 1))}>›</button>
          </div>
          <div className="cal-weekdays">{WEEKDAYS.map((w, i) => <span key={i}>{w}</span>)}</div>
          <div className="cal-grid">
            {days.map((d, i) => {
              const inMonth = d.getMonth() === viewDate.getMonth();
              const isStart = sameDay(d, activeStart);
              const isEnd = sameDay(d, activeEnd);
              const inRange = activeStart && activeEnd && d > activeStart && d < activeEnd;
              const isToday = sameDay(d, TODAY);
              const cls = ['cal-day', !inMonth && 'muted', isStart && 'range-start', isEnd && 'range-end', inRange && 'in-range', isToday && 'today'].filter(Boolean).join(' ');
              return <button type="button" key={i} className={cls} onClick={() => pickDay(d)}>{d.getDate()}</button>
            })}
          </div>
          <div className="cal-foot">
            <div className="cal-presets">
              <button type="button" className="filter-chip" onClick={() => preset(7)}>7 dias</button>
              <button type="button" className="filter-chip" onClick={() => preset(14)}>14 dias</button>
              <button type="button" className="filter-chip" onClick={() => preset(30)}>30 dias</button>
            </div>
            <button type="button" className="tiny-link" onClick={() => setOpen(false)}>Fechar</button>
          </div>
        </div>}
      </div>
    }

      },
      {
        test: q => /arquivo|pasta|kv/i.test(q),
        answer: "No protótipo eu também consultaria o servidor em modo somente leitura. Exemplo:\n\n/NSG/2026/Cafe_e_Conversa/KV/aprovados/KV_CafeConversa_v08.psd\n\nVersão 08 · modificada em 21 ago · marcada como aprovada."
      }
    ];

    function AgentChat({ open, setOpen, page, seedQuestion }) {
      const [messages, setMessages] = useState([
        { from: 'bot', text: 'Oi. Eu acompanho jobs, pessoas, clientes e arquivos. Pode perguntar o que está acontecendo na agência.' }
      ]);
      const [text, setText] = useState('');
      const messagesRef = useRef();

      const context = {
        overview: 'Visão geral · situação geral da agência',
        week: 'Trabalhos · produção criativa da semana',
        kanban: 'Kanban · fluxo e distribuição dos jobs',
        people: 'Pessoas · capacidade e clientes'
      }[page];

      function answer(q) {
        const rule = botRules.find(r => r.test(q));
        return rule ? rule.answer : `Estou olhando ${context.toLowerCase()}.\n\nNeste mock eu responderia cruzando jobs, capacidade, histórico e arquivos do servidor. Para “${q}”, eu retornaria uma resposta baseada nesses dados e links diretos para os itens relevantes.`;
      }

      function send(q = text) {
        if (!q.trim()) return;
        setOpen(true);
        setMessages(m => [...m, { from: 'user', text: q }]);
        setText('');
        setTimeout(() => setMessages(m => [...m, { from: 'bot', text: answer(q) }]), 260);
      }

      useEffect(() => { if (seedQuestion) { send(seedQuestion); } }, [seedQuestion]);
      useEffect(() => {
        if (!open || !messagesRef.current) return;
        messagesRef.current.scrollTo({ top: messagesRef.current.scrollHeight, behavior: 'smooth' });
      }, [messages, open]);

      const suggestions = page === 'people'
        ? ['Quem está livre?', 'Quem está sobrecarregado?', 'Compare os clientes']
        : page === 'kanban'
          ? ['O que vence hoje?', 'Quais jobs estão parados?', 'Organiza minhas prioridades']
          : page === 'week'
            ? ['O que fizemos para NSG?', 'Trabalhos parecidos', 'Onde estão os arquivos?']
            : ['O que precisa de atenção?', 'Quem pode pegar job?', 'Resumo da NSG'];

      return <>
        <aside className={'chat-panel ' + (!open ? 'hidden' : '')}>
          <div className="chat-head">
            <div className="agent-id">
              <div className="agent-face">O</div>
              <div><strong>Oráculo</strong><span><i className="online-dot" /> online · somente leitura</span></div>
            </div>
            <button type="button" className="chat-close" aria-label="Fechar Oráculo" onClick={(e) => { e.preventDefault(); e.stopPropagation(); setOpen(false); }}>×</button>
          </div>
          <div className="context-chip">Contexto atual: <b>{context}</b></div>
          <div className="messages" ref={messagesRef}>
            {messages.map((m, i) => <div key={i} className={'message ' + (m.from === 'bot' ? 'bot' : 'user')}>{m.text}</div>)}
          </div>
          <div className="suggestions">
            {suggestions.map(s => <button className="suggestion" key={s} onClick={() => send(s)}>{s}</button>)}
          </div>
          <div className="chat-compose">
            <input value={text} onChange={e => setText(e.target.value)} onKeyDown={e => { if (e.key === 'Enter') send() }} placeholder="Pergunte qualquer coisa sobre a Verge..." />
            <button type="button" className="send-btn" onClick={() => send()}>↑</button>
          </div>
        </aside>
        {!open && <button type="button" className="chat-fab" onClick={() => setOpen(true)} title="Abrir Oráculo">O<span className="badge">1</span></button>}
      </>
    }

    function App() {
      const [page, setPage] = useState('overview');
      const [navOpen, setNavOpen] = useState(false);
      const [chatOpen, setChatOpen] = useState(() => typeof window !== 'undefined' ? window.innerWidth > 800 : true);
      const [seedQuestion, setSeedQuestion] = useState('');
      const [toastText, setToastText] = useState('');

      function askAgent(q) {
        setChatOpen(true);
        setSeedQuestion('');
        setTimeout(() => setSeedQuestion(q), 0);
      }
      function toast(t) {
        setToastText(t);
        setTimeout(() => setToastText(''), 1600);
      }

      return <div className="app">
        <Sidebar page={page} setPage={setPage} navOpen={navOpen} onNavigate={() => setNavOpen(false)} />
        {navOpen && <div className="sidebar-backdrop" onClick={() => setNavOpen(false)} />}
        <main className="main">
          <Topbar page={page} onToggleNav={() => setNavOpen(v => !v)} />
          <div className={'content ' + (chatOpen ? 'with-chat' : '')}>
            {page === 'overview' && <Overview askAgent={askAgent} />}
            {page === 'week' && <Week />}
            {page === 'kanban' && <Kanban askAgent={askAgent} toast={toast} />}
            {page === 'people' && <People askAgent={askAgent} />}
          </div>
        </main>
        <AgentChat open={chatOpen} setOpen={setChatOpen} page={page} seedQuestion={seedQuestion} />
        {toastText && <div className="toast">{toastText}</div>}
      </div>
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>

</html>
